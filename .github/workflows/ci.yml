name: CI — Tests & MLOps Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.13.0"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Install dependencies (CPU torch for CI)
        run: |
          uv pip install --python .venv -e ".[dev]" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
          uv pip install --python .venv "ruff==0.17.0"

      - name: Lint with ruff
        run: .venv/bin/ruff check src/ tests/ scripts/ api/ --output-format=github

      - name: Run unit tests
        run: uv run --python .venv pytest tests/unit/ -v --tb=short

      - name: Run correctness tests (A1 Permutation Equivariance & Manual Hand-Calculations)
        run: uv run --python .venv pytest tests/correctness/ -v --tb=short

      - name: Run leakage tests (A3 Message Passing Split Disjointness & Symmetric Decoder)
        run: uv run --python .venv pytest tests/leakage/ -v --tb=short

      - name: Run integration tests (A4 API Offline Agreement & Edge Cases)
        run: uv run --python .venv pytest tests/integration/ -v --tb=short

      - name: Run MLOps pipeline end-to-end verification
        run: |
          uv run --python .venv python scripts/train_mlflow_pipeline.py
          uv run --python .venv python scripts/demonstrate_inductive_inference.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .coverage
