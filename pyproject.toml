[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Tell uv to always fetch torch from the CPU-only PyTorch index.
# This avoids the full CUDA build (~2.5 GB with nvidia-* libs).
# Swap to 'pytorch-cu121' for GPU support.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[project]
name = "graphforge"
version = "0.1.0"
description = "Graph Neural Network Engineering and MLOps"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "GraphForge" }]
license = { text = "MIT" }

dependencies = [
    # Core numerics
    "numpy>=1.26,<2.0",
    "pandas>=2.2",
    "scipy>=1.13",

    # Deep learning (CPU build — override in tool.uv.sources for GPU)
    "torch>=2.3,<2.6",

    # Graph ML
    "torch-geometric>=2.5",
    "networkx>=3.3",

    # ML utilities
    "scikit-learn>=1.5",

    # Experiment tracking
    "mlflow>=2.14",

    # API serving
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",

    # Visualization
    "matplotlib>=3.9",
    "seaborn>=0.13",

    # Notebooks
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",

    # Dev utilities
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
